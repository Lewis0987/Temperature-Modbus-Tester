stages:
  - test
  - build

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

test:
  stage: test
  tags:
    - windows-gui,windows,dotnet
  script:
    - dotnet --version
    - python --version
    - dotnet restore "ModbusTester.slnx"
    - python -m venv "tools/pi_modbus_server/.venv"
    - '& "tools/pi_modbus_server/.venv/Scripts/python.exe" -m pip install --upgrade pip'
    - '& "tools/pi_modbus_server/.venv/Scripts/python.exe" -m pip install "pymodbus==3.15.0"'
    - dotnet test "ModbusTester.slnx" --configuration Release --no-restore

build:
  stage: build
  tags:
    - windows
    - dotnet
  script:
    - dotnet restore "src/ModbusTester.App/ModbusTester.App.csproj"
    - dotnet publish "src/ModbusTester.App/ModbusTester.App.csproj" --configuration Release --output "publish"
  artifacts:
    paths:
      - publish/
    expire_in: 14 days